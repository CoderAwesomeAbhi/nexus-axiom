version: '3.8'

services:
  nexus-axiom:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/coderawesomeabhi/nexus-axiom:latest
    container_name: nexus-axiom
    restart: unless-stopped
    # eBPF/LSM requires privileged + host access
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - nexus-logs:/var/log/nexus-axiom
    environment:
      - RUST_LOG=${LOG_LEVEL:-info}
      - NEXUS_MODE=${NEXUS_MODE:-audit}
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexus-prometheus
    restart: unless-stopped
    volumes:
      - ../grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: nexus-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-nexus-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/dashboard.json:/etc/grafana/provisioning/dashboards/nexus.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  nexus-logs:
  prometheus-data:
  grafana-data:
