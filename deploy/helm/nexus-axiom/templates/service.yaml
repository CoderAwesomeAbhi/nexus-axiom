apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-axiom.fullname" . }}
  labels:
    {{- include "nexus-axiom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexus-axiom.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.service.dashboardPort }}
      targetPort: dashboard
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nexus-axiom.fullname" . }}
  labels:
    {{- include "nexus-axiom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nexus-axiom.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
{{- end }}
