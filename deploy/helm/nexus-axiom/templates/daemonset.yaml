apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nexus-axiom.fullname" . }}
  labels:
    {{- include "nexus-axiom.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nexus-axiom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-axiom.selectorLabels" . | nindent 8 }}
    spec:
      hostPID: {{ .Values.hostPID }}
      hostNetwork: {{ .Values.hostNetwork }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nexus-axiom
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NEXUS_MODE
              value: {{ .Values.mode | quote }}
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
          securityContext:
            privileged: {{ .Values.privileged }}
          volumeMounts:
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
          ports:
            - containerPort: {{ .Values.service.dashboardPort }}
              name: dashboard
            - containerPort: {{ .Values.service.metricsPort }}
              name: metrics
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: btf
          hostPath:
            path: /sys/kernel/btf
