[package]
name = "nexus-axiom"
version = "1.0.0"
edition = "2021"
description = "Real eBPF security that actually kills exploits"
license = "GPL-3.0"
repository = "https://github.com/CoderAwesomeAbhi/nexus-axiom"
keywords = ["security", "ebpf", "lsm", "exploit", "kernel"]
categories = ["os::linux-apis", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
sha2 = "0.10"
regex = "1.10"
libc = "0.2"
rand = "0.8"

# Quantum-resistant cryptography (Post-Quantum Cryptography)
pqcrypto-sphincsplus = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.23"
libbpf-sys = "1.4"
libseccomp = "0.3"
inotify = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }


nix = { version = "0.27", features = ["user", "signal", "process"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.23"

[features]
default = []
quantum = ["pqcrypto-sphincsplus", "pqcrypto-traits"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
