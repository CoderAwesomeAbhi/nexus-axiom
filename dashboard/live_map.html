<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Axiom — Live Attack Map</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020510;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden}
  #canvas{position:fixed;inset:0}

  /* ── HUD ── */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}

  /* top bar */
  #topbar{position:absolute;top:0;left:0;right:0;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(2,5,16,.95) 0%,transparent 100%)}
  #logo{font-size:22px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #status{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b92b0}
  .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* stats row */
  #stats{position:absolute;top:60px;left:24px;display:flex;gap:16px;pointer-events:auto}
  .stat-card{background:rgba(10,14,39,.85);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:12px 20px;min-width:130px;backdrop-filter:blur(8px)}
  .stat-card .label{font-size:11px;color:#8b92b0;text-transform:uppercase;letter-spacing:1px}
  .stat-card .val{font-size:32px;font-weight:700;margin-top:4px}
  .val.red{color:#ff4757}.val.cyan{color:#00d4ff}.val.purple{color:#7b2ff7}.val.green{color:#2ecc71}

  /* feed panel */
  #feed{position:absolute;top:60px;right:24px;width:340px;
    background:rgba(10,14,39,.88);border:1px solid rgba(255,0,68,.25);
    border-radius:12px;backdrop-filter:blur(8px);pointer-events:auto;
    display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
  #feed-header{padding:14px 16px;border-bottom:1px solid rgba(255,0,68,.2);
    display:flex;align-items:center;justify-content:space-between}
  #feed-header h2{font-size:14px;color:#ff4757;letter-spacing:1px;text-transform:uppercase}
  #feed-count{font-size:12px;color:#8b92b0}
  #feed-list{overflow-y:auto;flex:1;padding:8px}
  #feed-list::-webkit-scrollbar{width:4px}
  #feed-list::-webkit-scrollbar-track{background:transparent}
  #feed-list::-webkit-scrollbar-thumb{background:#7b2ff7;border-radius:2px}

  .attack-item{padding:10px 12px;margin:6px 0;border-radius:8px;
    border-left:3px solid #ff4757;background:rgba(255,0,68,.07);
    animation:slideIn .3s ease-out}
  .attack-item.high{border-color:#ff9f43;background:rgba(255,159,67,.07)}
  .attack-item.medium{border-color:#ffd32a;background:rgba(255,211,42,.07)}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .ai-type{font-size:13px;font-weight:600;color:#ff4757}
  .ai-type.high{color:#ff9f43}.ai-type.medium{color:#ffd32a}
  .ai-meta{font-size:11px;color:#8b92b0;margin-top:4px;line-height:1.5}
  .ai-flag{font-size:16px;margin-right:4px}

  /* bottom bar */
  #bottombar{position:absolute;bottom:0;left:0;right:0;padding:10px 24px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(0deg,rgba(2,5,16,.95) 0%,transparent 100%);
    font-size:12px;color:#8b92b0}
  #bottombar a{color:#00d4ff;text-decoration:none}

  /* demo badge */
  #demo-badge{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    background:rgba(123,47,247,.2);border:1px solid #7b2ff7;border-radius:20px;
    padding:6px 16px;font-size:12px;color:#7b2ff7;display:none}

  /* tooltip */
  #tooltip{position:absolute;background:rgba(10,14,39,.95);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;
    display:none;max-width:220px;z-index:20}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="logo">🛡️ NEXUS AXIOM</div>
    <div id="status"><span class="dot"></span><span id="conn-label">Connecting…</span></div>
  </div>

  <div id="stats">
    <div class="stat-card"><div class="label">Total Blocked</div><div class="val red" id="s-total">0</div></div>
    <div class="stat-card"><div class="label">Last Minute</div><div class="val cyan" id="s-min">0</div></div>
    <div class="stat-card"><div class="label">Active Arcs</div><div class="val purple" id="s-arcs">0</div></div>
    <div class="stat-card"><div class="label">Uptime</div><div class="val green" id="s-uptime">0s</div></div>
  </div>

  <div id="feed">
    <div id="feed-header">
      <h2>🚨 Live Attacks</h2>
      <span id="feed-count">0 events</span>
    </div>
    <div id="feed-list"></div>
  </div>

  <div id="bottombar">
    <span>Built by an 8th grader · Open Source</span>
    <a href="https://github.com/CoderAwesomeAbhi/nexus-axiom" target="_blank">github.com/CoderAwesomeAbhi/nexus-axiom</a>
  </div>

  <div id="demo-badge">⚡ DEMO MODE — simulating attacks</div>
</div>

<div id="tooltip"></div>

<!-- Three.js r158 from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// GLOBE RENDERER
// ═══════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 2.8);

// ── Globe ──────────────────────────────────────────────────────────────────
const GLOBE_R = 1.0;
const globeGeo = new THREE.SphereGeometry(GLOBE_R, 64, 64);

// Procedural ocean + land shader
const globeMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec3 vNormal;
    varying vec2 vUv;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vNormal;
    varying vec2 vUv;
    uniform float time;

    // Simple pseudo-random
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p); vec2 f=fract(p);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }

    void main(){
      // Equirectangular-ish land mask via layered noise
      vec2 uv = vUv * vec2(6.28318, 3.14159);
      float n = noise(uv*1.8)*0.5 + noise(uv*3.6)*0.3 + noise(uv*7.2)*0.2;
      bool isLand = n > 0.52;

      vec3 ocean = vec3(0.02, 0.08, 0.22);
      vec3 land  = vec3(0.05, 0.18, 0.12);
      vec3 base  = isLand ? land : ocean;

      // Atmosphere rim glow
      float rim = 1.0 - max(dot(vNormal, vec3(0,0,1)), 0.0);
      rim = pow(rim, 3.0);
      vec3 atmo = vec3(0.0, 0.4, 1.0) * rim * 0.6;

      // Grid lines
      vec2 grid = abs(fract(vUv * vec2(36.0, 18.0)) - 0.5);
      float line = min(grid.x, grid.y);
      float gridAlpha = smoothstep(0.04, 0.0, line) * 0.15;
      vec3 gridColor = vec3(0.0, 0.8, 1.0);

      vec3 col = base + atmo + gridColor * gridAlpha;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const globe = new THREE.Mesh(globeGeo, globeMat);
scene.add(globe);

// ── Atmosphere glow ────────────────────────────────────────────────────────
const atmoGeo = new THREE.SphereGeometry(GLOBE_R * 1.06, 64, 64);
const atmoMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  transparent: true,
  uniforms: {},
  vertexShader: `varying vec3 vNormal; void main(){ vNormal=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vNormal; void main(){ float i=pow(1.0-dot(vNormal,vec3(0,0,1)),4.0); gl_FragColor=vec4(0.0,0.5,1.0,i*0.4); }`
});
scene.add(new THREE.Mesh(atmoGeo, atmoMat));

// ── Stars ──────────────────────────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(6000);
for(let i=0;i<6000;i++) starPos[i]=(Math.random()-0.5)*200;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.08, transparent:true, opacity:0.6 })));

// ── Lighting ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112244, 2));
const sun = new THREE.DirectionalLight(0x4488ff, 1.5);
sun.position.set(5, 3, 5);
scene.add(sun);

// ── Drag to rotate ─────────────────────────────────────────────────────────
let isDragging = false, prevMouse = {x:0,y:0};
let rotVel = {x:0, y:0};
canvas.addEventListener('mousedown', e => { isDragging=true; prevMouse={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('mousemove', e => {
  if(!isDragging) return;
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  rotVel.y += dx * 0.005;
  rotVel.x += dy * 0.005;
  prevMouse = {x:e.clientX, y:e.clientY};
});
canvas.addEventListener('mouseup', () => isDragging=false);
canvas.addEventListener('mouseleave', () => isDragging=false);

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════════════════════════
// ARC SYSTEM
// ═══════════════════════════════════════════════════════════════════════════
const arcs = [];

function latLonToVec3(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function severityColor(sev) {
  if(sev === 'critical') return new THREE.Color(0xff2244);
  if(sev === 'high')     return new THREE.Color(0xff9f43);
  return new THREE.Color(0xffd32a);
}

function spawnArc(srcLat, srcLon, dstLat, dstLon, severity) {
  const src = latLonToVec3(srcLat, srcLon, GLOBE_R);
  const dst = latLonToVec3(dstLat, dstLon, GLOBE_R);

  // Bezier control point lifted above the surface
  const mid = src.clone().add(dst).multiplyScalar(0.5);
  const lift = 0.4 + src.distanceTo(dst) * 0.5;
  mid.normalize().multiplyScalar(GLOBE_R + lift);

  const curve = new THREE.QuadraticBezierCurve3(src, mid, dst);
  const points = curve.getPoints(80);
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const color = severityColor(severity);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9, linewidth: 1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);

  // Pulse dot at source
  const dotGeo = new THREE.SphereGeometry(0.012, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({ color });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.copy(src);
  scene.add(dot);

  // Impact ring at destination
  const ringGeo = new THREE.RingGeometry(0.015, 0.025, 16);
  const ringMat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(dst);
  ring.lookAt(dst.clone().multiplyScalar(2));
  scene.add(ring);

  const arc = { line, dot, ring, progress: 0, life: 1.0, severity, points, color };
  arcs.push(arc);
  document.getElementById('s-arcs').textContent = arcs.length;
  return arc;
}

function updateArcs(dt) {
  for(let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.progress = Math.min(1, a.progress + dt * 0.4);

    // Animate arc draw by updating geometry
    const visible = Math.floor(a.progress * a.points.length);
    const pts = a.points.slice(0, Math.max(2, visible));
    a.line.geometry.setFromPoints(pts);
    a.line.geometry.computeBoundingSphere();

    // Fade out after full draw
    if(a.progress >= 1) {
      a.life -= dt * 0.3;
      a.line.material.opacity = Math.max(0, a.life * 0.9);
      a.dot.material.opacity  = Math.max(0, a.life);
      a.ring.material.opacity = Math.max(0, a.life * 0.8);
      // Expand ring
      a.ring.scale.setScalar(1 + (1 - a.life) * 3);
    }

    if(a.life <= 0) {
      scene.remove(a.line, a.dot, a.ring);
      a.line.geometry.dispose(); a.line.material.dispose();
      a.dot.geometry.dispose();  a.dot.material.dispose();
      a.ring.geometry.dispose(); a.ring.material.dispose();
      arcs.splice(i, 1);
      document.getElementById('s-arcs').textContent = arcs.length;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════════
let last = performance.now();
const startTime = Date.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - last) / 1000;
  last = now;

  globeMat.uniforms.time.value += dt;

  // Auto-rotate + dampen drag
  if(!isDragging) {
    rotVel.y *= 0.95;
    rotVel.x *= 0.95;
    globe.rotation.y += 0.0015 + rotVel.y;
    globe.rotation.x += rotVel.x;
    globe.rotation.x = Math.max(-0.5, Math.min(0.5, globe.rotation.x));
  } else {
    globe.rotation.y += rotVel.y;
    globe.rotation.x += rotVel.x;
    rotVel = {x:0, y:0};
  }

  updateArcs(dt);

  // Uptime
  const up = Math.floor((Date.now() - startTime) / 1000);
  const h = Math.floor(up/3600), m = Math.floor((up%3600)/60), s = up%60;
  document.getElementById('s-uptime').textContent =
    h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;

  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════════════════════════
// WEBSOCKET + EVENT HANDLING
// ═══════════════════════════════════════════════════════════════════════════
let totalBlocks = 0, minuteBlocks = 0, feedCount = 0;
let demoMode = false;

// Reset per-minute counter
setInterval(() => { minuteBlocks = 0; document.getElementById('s-min').textContent = '0'; }, 60000);

function handleEvent(ev) {
  if(ev.kind !== 'block') return;

  totalBlocks++;
  minuteBlocks++;
  feedCount++;
  document.getElementById('s-total').textContent = totalBlocks;
  document.getElementById('s-min').textContent = minuteBlocks;
  document.getElementById('feed-count').textContent = feedCount + ' events';

  // Spawn arc on globe
  const srcLat = ev.src_lat || 0, srcLon = ev.src_lon || 0;
  const dstLat = ev.dst_lat || 37.77, dstLon = ev.dst_lon || -122.42;
  spawnArc(srcLat, srcLon, dstLat, dstLon, ev.severity || 'critical');

  // Feed item
  addFeedItem(ev);
}

const FLAG_MAP = {
  CN:'🇨🇳',RU:'🇷🇺',US:'🇺🇸',DE:'🇩🇪',BR:'🇧🇷',IN:'🇮🇳',KP:'🇰🇵',
  IR:'🇮🇷',NG:'🇳🇬',UA:'🇺🇦',GB:'🇬🇧',FR:'🇫🇷',JP:'🇯🇵',AU:'🇦🇺',ZA:'🇿🇦'
};

function addFeedItem(ev) {
  const list = document.getElementById('feed-list');
  const sev = ev.severity || 'critical';
  const flag = FLAG_MAP[ev.src_country] || '🌐';
  const city = ev.src_city ? `${ev.src_city}, ${ev.src_country}` : 'Unknown';
  const time = new Date().toLocaleTimeString();

  const el = document.createElement('div');
  el.className = `attack-item ${sev === 'critical' ? '' : sev}`;
  el.innerHTML = `
    <div class="ai-type ${sev === 'critical' ? '' : sev}">
      <span class="ai-flag">${flag}</span>${ev.event_type}
    </div>
    <div class="ai-meta">
      Process: <b>${ev.comm}</b> (PID ${ev.pid})<br>
      Origin: ${city}<br>
      ${time} · ✅ BLOCKED
    </div>`;
  list.insertBefore(el, list.firstChild);
  while(list.children.length > 30) list.removeChild(list.lastChild);
}

// ── WebSocket connection ───────────────────────────────────────────────────
let ws, wsRetries = 0;
const WS_PORT = (location.port ? parseInt(location.port) + 1 : 8081);

function connect() {
  const url = `ws://${location.hostname}:${WS_PORT}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    wsRetries = 0;
    document.getElementById('conn-label').textContent = 'Live · Connected';
    document.querySelector('.dot').style.background = '#2ecc71';
    if(demoMode) {
      demoMode = false;
      document.getElementById('demo-badge').style.display = 'none';
    }
  };

  ws.onmessage = e => {
    try { handleEvent(JSON.parse(e.data)); } catch(_) {}
  };

  ws.onerror = () => {
    document.getElementById('conn-label').textContent = 'Reconnecting…';
    document.querySelector('.dot').style.background = '#ff4757';
  };

  ws.onclose = () => {
    const delay = Math.min(30000, 1000 * Math.pow(2, wsRetries++));
    setTimeout(connect, delay);
  };
}

connect();

// ── Demo mode (fires if no real events after 5 s) ─────────────────────────
const DEMO_CITIES = [
  {cc:'CN',city:'Beijing',lat:39.9,lon:116.4},
  {cc:'RU',city:'Moscow',lat:55.75,lon:37.6},
  {cc:'KP',city:'Pyongyang',lat:39.0,lon:125.7},
  {cc:'IR',city:'Tehran',lat:35.7,lon:51.4},
  {cc:'NG',city:'Lagos',lat:6.5,lon:3.4},
  {cc:'UA',city:'Kyiv',lat:50.45,lon:30.5},
  {cc:'BR',city:'São Paulo',lat:-23.55,lon:-46.6},
  {cc:'IN',city:'Mumbai',lat:19.08,lon:72.88},
  {cc:'DE',city:'Berlin',lat:52.52,lon:13.4},
  {cc:'GB',city:'London',lat:51.5,lon:-0.13},
];
const ATTACK_TYPES = ['W^X mmap','W^X mprotect','Unauthorized ptrace'];
const PROCESSES = ['exploit','shellcode','pwn','malware','rootkit','backdoor'];
const SEVERITIES = ['critical','critical','high','medium'];

function demoEvent() {
  const src = DEMO_CITIES[Math.floor(Math.random() * DEMO_CITIES.length)];
  const sev = SEVERITIES[Math.floor(Math.random() * SEVERITIES.length)];
  handleEvent({
    kind: 'block',
    event_type: ATTACK_TYPES[Math.floor(Math.random() * ATTACK_TYPES.length)],
    pid: Math.floor(Math.random() * 65535),
    uid: 0,
    comm: PROCESSES[Math.floor(Math.random() * PROCESSES.length)],
    timestamp: new Date().toISOString(),
    src_country: src.cc,
    src_city: src.city,
    src_lat: src.lat + (Math.random()-.5)*2,
    src_lon: src.lon + (Math.random()-.5)*2,
    dst_lat: 37.77,
    dst_lon: -122.42,
    severity: sev,
    details: 'demo'
  });
}

setTimeout(() => {
  if(totalBlocks === 0) {
    demoMode = true;
    document.getElementById('demo-badge').style.display = 'block';
    document.getElementById('conn-label').textContent = 'Demo Mode';
    // Burst of initial events
    for(let i=0;i<5;i++) setTimeout(demoEvent, i*400);
    // Ongoing stream
    setInterval(() => {
      if(demoMode) demoEvent();
    }, 1800 + Math.random()*1200);
  }
}, 5000);
</script>
</body>
</html>
